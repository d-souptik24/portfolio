<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 — Page Not Found | Souptik Dutta</title>
    <link rel="icon" type="image/png" href="images/profile/sd-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --accent: #8052ff;
            --accent-alt: #d97757;
            --bg: #000000;
            --surface: #111111;
            --text: #ffffff;
            --text-soft: #9a9a9a;
            --border: #222222;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 2rem;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 500px 500px at 30% 30%, rgba(128,82,255,0.15), transparent),
                radial-gradient(ellipse 400px 400px at 70% 70%, rgba(217,119,87,0.10), transparent);
            pointer-events: none;
            z-index: -1;
        }
        .error-container { max-width: 520px; }
        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: clamp(1.3rem, 3vw, 1.75rem);
            font-weight: 700;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-soft);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.5rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font: 600 0.95rem/1.1 'Inter', sans-serif;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(.4,0,.2,1);
        }
        .btn:hover {
            background: var(--accent);
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 4px 16px -4px rgba(128,82,255,0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <a href="index.html" class="btn">&#8592; Back to Portfolio</a>
    </div>
</body>
</html>
